<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover でノッチ/ホームバー領域も使い、env(safe-area-inset-*) を有効化 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>カビ取りキング ～魔法の大聖堂～</title>
  <link rel="icon" href="favicon.ico?v=1" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=1" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png?v=1" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=1" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #0e0a1e;
      overflow: hidden;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
      overscroll-behavior: none;
    }

    /* 画面全体（実ビューポート）。高さはJSで window.innerHeight を反映してiOSのアドレスバー問題を回避。
       セーフエリア分だけ内側に寄せ、その内側(=#game-wrap)にCanvasを収める。 */
    #stage {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;          /* JSで実寸に上書き */
      height: 100dvh;          /* 対応ブラウザ向けフォールバック */
      background: #0e0a1e;
      /* ノッチは片側だけinsetが大きく非対称になり、Canvasが画面中央からずれる。
         左右(と上下)を「大きい方の値」で揃え、ノッチを避けつつ画面中央に対称配置する。 */
      --inset-x: max(env(safe-area-inset-left), env(safe-area-inset-right));
      --inset-y: max(env(safe-area-inset-top), env(safe-area-inset-bottom));
      padding: var(--inset-y) var(--inset-x);
    }

    /* Phaserの親。セーフエリア内いっぱい。CanvasをFITで中央に収める */
    #game-wrap {
      position: relative;
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
    }
    canvas { display: block; max-width: 100%; max-height: 100%; }

    /* タッチUI（セーフエリア内に配置されるので端で途切れない） */
    #touch-ui {
      position: absolute;
      inset: max(env(safe-area-inset-top), env(safe-area-inset-bottom))
             max(env(safe-area-inset-left), env(safe-area-inset-right));
      pointer-events: none;
      display: none;            /* タッチ端末のみ表示 */
      z-index: 10;
    }
    body.touch #touch-ui { display: block; }
    .tbtn {
      position: absolute;
      pointer-events: auto;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 0.3vmin;
      color: #fff; font-weight: 800;
      background: rgba(80, 90, 160, 0.45);
      border: 3px solid rgba(255,255,255,0.7);
      border-radius: 50%;
      width: 15vmin; height: 15vmin;
      user-select: none;
      transition: transform .06s, background .08s;
    }
    .tbtn:active { transform: scale(0.93); }
    /* アイコンのみ（文字なし）。視界の端でも形で識別できるよう大きくはっきり */
    .tbtn .ic { width: 16.5vmin; height: 16.5vmin; display: flex; }
    .tbtn .ic svg { width: 100%; height: 100%; display: block;
      filter: drop-shadow(0 0.4vmin 0.4vmin rgba(0,0,0,0.45)); }
    /* 横持ち基準。vmin(=短辺=高さ)基準なので画面下部に確実に収まる */
    /* JUMP=緑＋上矢印 / 魔法=紫＋キラキラ。形と色の両方で直感的に区別。丸の大きさは共通 */
    #btn-jump  { left: 3vmin;  bottom: 3vmin; width: 30vmin; height: 30vmin;
                 background: rgba(46,168,96,0.6); border-color: rgba(190,255,210,0.85); }
    #btn-jump:active  { background: rgba(70,210,130,0.85); }
    #btn-fire  { right: 3vmin; bottom: 3vmin; width: 30vmin; height: 30vmin;
                 background: rgba(170,82,205,0.6); border-color: rgba(240,205,255,0.85); }
    #btn-fire:active  { background: rgba(205,110,245,0.85); }

    /* 縦持ち案内オーバーレイ（横スクロールゲームなので横持ち推奨） */
    #rotate-hint {
      display: none;
      position: fixed; inset: 0; z-index: 100;
      background: radial-gradient(circle at 50% 40%, #2a2150, #0e0a1e 80%);
      color: #fff; text-align: center;
      align-items: center; justify-content: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    body.portrait #rotate-hint { display: flex; }
    .rh-icon {
      font-size: 64px; line-height: 1;
      display: inline-block;
      animation: rh-rotate 1.8s ease-in-out infinite;
    }
    @keyframes rh-rotate {
      0%, 40%   { transform: rotate(0deg); }
      60%, 100% { transform: rotate(90deg); }
    }
    .rh-title { margin-top: 22px; font-size: 26px; font-weight: 700; color: #ffe27a; }

    /* 読み込み失敗（CDN/ネットワーク）時の案内 */
    #load-error {
      display: none;
      position: fixed; inset: 0; z-index: 200;
      background: #0e0a1e; color: #fff; text-align: center;
      align-items: center; justify-content: center; padding: 24px;
    }
    #load-error.show { display: flex; }
    #load-error button {
      margin-top: 18px; font-size: 18px; font-weight: 700; color: #fff;
      background: #5b4bd6; border: 0; border-radius: 10px; padding: 12px 28px;
    }

    /* 名前入力（タイトルでタップ後に表示）。スマホ横持ちでもキーボードに隠れないよう上寄せ */
    #name-entry {
      display: none;
      position: absolute; inset: 0; z-index: 50;
      background: rgba(14, 10, 30, 0.72);
      align-items: flex-start; justify-content: center;
      padding-top: 8vh;
      touch-action: manipulation;
    }
    #name-entry.show { display: flex; }
    #name-entry form {
      width: min(92%, 460px);
      background: #2a1d4a; border: 3px solid #ffd24a; border-radius: 14px;
      padding: 22px 22px 20px; text-align: center; color: #fff;
      box-shadow: 0 0 40px rgba(255, 210, 74, 0.35);
    }
    #name-entry label { display: block; font-size: 20px; font-weight: 800; color: #ffd24a; }
    #name-entry input {
      width: 100%; margin-top: 14px; padding: 12px 14px;
      font-size: 22px; font-weight: 700; text-align: center;
      color: #2a1d4a; background: #fff; border: 2px solid #5b4bd6; border-radius: 10px;
      outline: none; user-select: text; -webkit-user-select: text;
    }
    #name-entry input:focus { border-color: #ffd24a; box-shadow: 0 0 0 3px rgba(255,210,74,0.5); }
    #name-entry .hint { margin-top: 8px; font-size: 13px; color: #cfd6ff; }
    #name-entry button {
      margin-top: 16px; width: 100%; padding: 13px 0;
      font-size: 22px; font-weight: 800; color: #fff;
      background: #5b4bd6; border: 0; border-radius: 10px; cursor: pointer;
    }
    #name-entry button:focus-visible { outline: 3px solid #ffd24a; outline-offset: 2px; }
    .rh-sub   { margin-top: 12px; font-size: 16px; line-height: 1.7; color: #cfd6ff; }
  </style>
</head>
<body>
  <div id="stage">
    <div id="game-wrap"></div>
    <!-- 名前入力（Title.js が表示/非表示を切り替える） -->
    <div id="name-entry">
      <form id="name-form" autocomplete="off">
        <label for="name-input">なまえを入れてね</label>
        <input id="name-input" type="text" maxlength="10" enterkeyhint="go" placeholder="例：カビ取り太郎" />
        <div class="hint">ランキングに表示されます（10文字まで）</div>
        <button type="submit">スタート！</button>
      </form>
    </div>
    <div id="touch-ui">
      <!-- JUMP: 太い上向き矢印（周辺視でも「上＝ジャンプ」と分かるシルエット） -->
      <div class="tbtn" id="btn-jump">
        <span class="ic" aria-hidden="true">
          <svg viewBox="0 0 100 100">
            <path d="M50 8 L90 50 H68 V92 H32 V50 H10 Z"
                  fill="#ffffff" stroke="#1c5c34" stroke-width="5" stroke-linejoin="round"/>
          </svg>
        </span>
      </div>
      <!-- 魔法: キラキラ（4方向星＋小星）。矢印とは全く違う形で識別 -->
      <div class="tbtn" id="btn-fire">
        <span class="ic" aria-hidden="true">
          <svg viewBox="0 0 100 100">
            <path d="M50 18 C53 42 58 47 82 50 C58 53 53 58 50 82 C47 58 42 53 18 50 C42 47 47 42 50 18 Z"
                  fill="#ffffff" stroke="#5a1c70" stroke-width="4" stroke-linejoin="round"/>
            <path d="M80 12 C81 20 82 21 90 22 C82 23 81 24 80 32 C79 24 78 23 70 22 C78 21 79 20 80 12 Z"
                  fill="#fff3b0" stroke="#5a1c70" stroke-width="2.5" stroke-linejoin="round"/>
            <circle cx="20" cy="78" r="4.5" fill="#fff3b0" stroke="#5a1c70" stroke-width="2.5"/>
          </svg>
        </span>
      </div>
    </div>
  </div>

  <!-- 読み込み失敗時の案内 -->
  <div id="load-error">
    <div>
      <div class="rh-title">読み込みに失敗しました</div>
      <div class="rh-sub">通信状況を確認して、もう一度お試しください</div>
      <button type="button" onclick="location.reload()">再読み込み</button>
    </div>
  </div>

  <!-- 縦持ち時の案内 -->
  <div id="rotate-hint">
    <div>
      <div class="rh-icon">📱</div>
      <div class="rh-title">横向きにしてください</div>
      <div class="rh-sub">スマホを横にすると<br>ゲーム画面が広く表示されます</div>
    </div>
  </div>

  <script>
    // iOS Safari のアドレスバーで 100vh がずれる問題に対応：
    // 実ビューポート高(window.innerHeight)を #stage の高さに反映する。
    (function () {
      var stage = document.getElementById("stage");
      function applyHeight() {
        stage.style.height = window.innerHeight + "px";
      }
      applyHeight();
      window.addEventListener("resize", applyHeight);
      window.addEventListener("orientationchange", function () {
        setTimeout(applyHeight, 250);
      });
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", applyHeight);
      }
    })();
  </script>

  <script>
    window.showLoadError = function () {
      document.getElementById("load-error").classList.add("show");
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js" onerror="showLoadError()"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
